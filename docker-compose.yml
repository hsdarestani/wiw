services:
  caddy:
    image: caddy:2.8-alpine
    container_name: schichtpro-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: schichtpro-web
    restart: unless-stopped
    expose:
      - "3000"

  postgres:
    image: postgres:16
    container_name: schichtpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: schichtpro
      POSTGRES_USER: schichtpro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
