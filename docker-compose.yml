services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: schichtpro-web
    restart: unless-stopped
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16
    container_name: schichtpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: schichtpro
      POSTGRES_USER: schichtpro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
