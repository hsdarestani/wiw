services:
  caddy:
    image: caddy:2.8-alpine
    container_name: schichtpro-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: schichtpro-web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://schichtpro:${POSTGRES_PASSWORD}@postgres:5432/schichtpro
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: schichtpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: schichtpro
      POSTGRES_USER: schichtpro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schichtpro -d schichtpro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
